apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: opsproof-traffic
resources:
  - ../../base
patches:
  - target:
      kind: Deployment
      name: payment-api
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: "450"
