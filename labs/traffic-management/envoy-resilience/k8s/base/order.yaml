apiVersion: v1
kind: Service
metadata:
  name: order-api
spec:
  selector:
    app.kubernetes.io/name: order-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: envoy-admin
spec:
  selector:
    app.kubernetes.io/name: order-api
  ports:
    - name: admin
      port: 9901
      targetPort: envoy-admin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: order-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-api
    spec:
      containers:
        - name: order-api
          image: opsproof/traffic-demo:v1
          imagePullPolicy: IfNotPresent
          env:
            - name: ROLE
              value: order
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /health, port: http }
        - name: envoy
          image: envoyproxy/envoy:v1.31.0
          imagePullPolicy: IfNotPresent
          args: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "warning"]
          ports:
            - name: envoy-admin
              containerPort: 9901
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy
              readOnly: true
      volumes:
        - name: envoy-config
          configMap:
            name: order-envoy-config
