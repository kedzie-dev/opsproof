apiVersion: batch/v1
kind: Job
metadata:
  name: migration-v1
  namespace: opsproof
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: psql
          image: postgres:18-alpine
          env:
            - name: PGHOST
              value: postgres
            - name: PGDATABASE
              value: opsproof
            - name: PGUSER
              value: postgres
          command: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/migrations/v1.sql"]
          volumeMounts:
            - name: migrations
              mountPath: /migrations
      volumes:
        - name: migrations
          configMap:
            name: migration-v1
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: migration-v1
  namespace: opsproof
data:
  v1.sql: |
    CREATE TABLE IF NOT EXISTS orders (
      id UUID PRIMARY KEY,
      customer_name TEXT NOT NULL
    );

