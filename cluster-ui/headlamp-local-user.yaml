apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp-local-user
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: opsproof-headlamp-local-user
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: headlamp-local-user
    namespace: opsproof-cluster-ui
